<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>July Shortlist – The Bookclub AE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #940D0D;
      --ink:      #1C1C1C;
      --muted:    #6B6460;
      --card-bg:  #FFFFFF;
      --border:   #E2DDD8;
      --genre:    #940D0D;
      --radius:   12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* ── HERO ───────────────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 56px 24px 48px;
    }

    .hero-title-img {
      max-width: 520px;
      width: 90%;
      display: block;
      margin: 0 auto;
    }

    .hero-sub {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    /* ── BOOKS SECTION ──────────────────────────────────── */
    .books-section {
      background: var(--bg);
      padding: 40px 20px 0;
    }

    .books-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Desktop: 3-col gallery */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* Mobile: single-column list */
    @media (max-width: 700px) {
      .books-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    /* ── BOOK CARD ──────────────────────────────────────── */
    .book-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.18);
    }

    /* Mobile: horizontal layout */
    @media (max-width: 700px) {
      .book-card {
        flex-direction: row;
        min-height: 160px;
      }
    }

    .book-cover-wrap {
      background: var(--border);
      flex-shrink: 0;
    }

    @media (min-width: 701px) {
  .book-cover-wrap {
    width: 100%;
  }
}

@media (max-width: 700px) {
  .book-cover-wrap {
    width: 110px;
    min-height: 160px;
    display: flex;
    align-items: center;
  }
}

.book-cover {
  width: 100%;
  height: auto;
  display: block;
}

    .book-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .book-genre {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--genre);
      margin-bottom: 8px;
    }

    .book-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .book-author {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .book-summary {
      font-size: 13px;
      line-height: 1.65;
      color: #4A4545;
      flex: 1;
      margin-bottom: 16px;
    }

    @media (max-width: 700px) {
      .book-summary {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    }

    .book-meta {
      display: flex;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .meta-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meta-pill svg { opacity: 0.55; }

    /* ── FOOTER / LOGO ──────────────────────────────────── */
    footer {
      padding: 56px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .footer-logo {
      max-width: 220px;
      width: 100%;
      display: block;
    }

    .footer-note {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- ── HERO ───────────────────────────────────────────────── -->
<header class="hero">
  <img
    class="hero-title-img"

  />

</main>

<!-- ── FOOTER ─────────────────────────────────────────────── -->
<footer>
  <img
    class="footer-logo"
    src="logos/logo.png"
    alt="The Bookclub AE"
  />
  <p class="footer-note">@thebookclub_ae &nbsp;·&nbsp; Abu Dhabi</p>
</footer>
