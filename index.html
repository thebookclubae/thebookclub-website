<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Shortlist – The Bookclub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #940D0D;
      --ink:      #1C1C1C;
      --muted:    #6B6460;
      --card-bg:  #FFFFFF;
      --border:   #E2DDD8;
      --genre:    #940D0D;
      --radius:   12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* ── HERO ───────────────────────────────────────────── */
    .hero {
      text-align: center;
      padding: 56px 24px 48px;
    }

    .hero-title-img {
      max-width: 520px;
      width: 90%;
      display: block;
      margin: 0 auto;
    }

    .hero-sub {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    /* ── BOOKS SECTION ──────────────────────────────────── */
    .books-section {
      background: var(--bg);
      padding: 40px 20px 0;
    }

    .books-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Desktop: 3-col gallery */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* Mobile: single-column list */
    @media (max-width: 700px) {
      .books-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    /* ── BOOK CARD ──────────────────────────────────────── */
    .book-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.18);
    }

    /* Mobile: vertical stack — cover on top, full text below,
       one book after another down the page. */
    @media (max-width: 700px) {
      .book-card {
        flex-direction: column;
      }
    }

    .book-cover-wrap {
      background: var(--border);
      flex-shrink: 0;
      width: 100%;
    }

    /* Mobile: cap the cover height so the card doesn't open with a
       giant image; keep it centered and let text lead. */
    @media (max-width: 700px) {
      .book-cover-wrap {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        max-height: 320px;
        overflow: hidden;
      }
    }

    .book-cover {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 700px) {
      .book-cover {
        width: auto;
        max-width: 100%;
        max-height: 320px;
        object-fit: contain;
      }
    }

    .book-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Row of individual genre tags — flat, underlined (Goodreads style) */
    .book-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      margin-bottom: 12px;
    }

    .genre-chip {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--genre);
      border-bottom: 0.5px solid var(--genre);
      padding-bottom: 3px;
    }

    /* Where the book is set — plain country name in the genre red,
       no pin, no underline. */
    .book-setting {
      font-size: 11px;
      color: var(--genre);
      margin-bottom: 12px;
    }

    .book-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.25;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .book-author {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Wrapper grows to fill leftover card height, so empty space collects
       at the BOTTOM of short cards instead of stretching gaps between
       paragraphs. Individual paragraphs keep their natural height. */
    .book-summary-group {
      flex: 1;
      margin-bottom: 16px;
    }

    .book-summary {
      font-size: 13px;
      line-height: 1.65;
      color: #4A4545;
    }

    /* Space BETWEEN paragraphs only (never before the first). */
    .book-summary + .book-summary {
      margin-top: 12px;
    }

    .book-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .meta-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meta-pill svg { opacity: 0.55; }

    /* ── FOOTER / LOGO ──────────────────────────────────── */
    footer {
      padding: 56px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .footer-logo {
      max-width: 220px;
      width: 100%;
      display: block;
    }

    .footer-note {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
  </style>
</head>

const grid = document.getElementById('booksGrid');

books.forEach(book => {

    .map(p => `<p class="book-summary">${p}</p>`)
    .join("");

    .split("/")

    <div class="book-cover-wrap">
      <img class="book-cover" src="${book.cover}" alt="Cover of ${book.title}" loading="lazy" />
    </div>
    <div class="book-body">
      <div class="book-genres">${genreChips}</div>
      ${book.setting ? `<div class="book-setting">${book.setting}</div>` : ""}
      <h2 class="book-title">${book.title}</h2>
      <p class="book-author">${book.author}</p>
      <div class="book-summary-group">
        ${summaryParas}
      </div>
      <div class="book-meta">
        <span class="meta-pill">
